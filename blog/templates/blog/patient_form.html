{% extends "base.html" %}
{% block title %}{% if patient %}Өңдеу{% else %}Жаңа науқас{% endif %}{% endblock %}
{% block content %}
<div class="page-head"><h1>{% if patient %}Өңдеу: {{ patient.full_name }}{% else %}Жаңа науқас{% endif %}</h1></div>
<div class="card form-card">
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "blog/_form_fields.html" %}
    <div class="form-actions">
      <button>Сақтау</button>
      <a class="btn btn-secondary" href="{% url 'patient_list' %}">Болдырмау</a>
    </div>
  </form>
</div>
{% endblock %}
